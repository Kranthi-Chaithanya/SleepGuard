name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - run: cp app/build/outputs/apk/debug/app-debug.apk SleepGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SleepGuard.apk

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build SleepGuard-PC.exe
        run: >
          dotnet publish desktop/SleepGuard.Desktop/SleepGuard.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - run: Copy-Item out/SleepGuard.exe SleepGuard-PC.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SleepGuard-PC.exe

  release:
    needs: [android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SleepGuard 1.0 (build ${{ github.run_number }})
          make_latest: true
          files: |
            dist/SleepGuard.apk
            dist/SleepGuard-PC.exe
          body: |
            ## 📱 Android — `SleepGuard.apk`
            Download on your phone and open it (allow "Install unknown apps" for your browser or Files app).
            Then: App info → ⋮ → *Allow restricted settings*, and turn on SleepGuard under Settings → Accessibility.

            ## 💻 Windows PC — `SleepGuard-PC.exe`
            Windows 10/11, 64-bit. No install needed: save it somewhere permanent (e.g. Documents) and double-click.
            Windows SmartScreen may say "Windows protected your PC" because the app isn't code-signed — click **More info → Run anyway**.
            SleepGuard then lives in the tray (moon icon near the clock) and starts with Windows.
